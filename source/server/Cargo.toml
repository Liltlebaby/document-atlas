[package]
name = "document-atlas-web"
version = "0.7.0"
description = "Local document portal explorer"
authors = ["Document Atlas"]
edition = "2021"
autolib = false

[dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "net", "process", "io-util", "macros", "rt-multi-thread", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "stream"] }
scraper = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
url = "2"
pdf-extract = "0.12.1"
lopdf = { version = "0.42", default-features = false }
sqlite-vec = "0.1.9"
fastembed = { version = "7.1", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
